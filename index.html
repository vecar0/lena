<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>레나</title>
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레나">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08090b;--panel:#101216;--panel2:#171a20;--line:rgba(255,255,255,.12);
  --teal:#2fe0c8;--mint:#9ff5e4;--pink:#ff3d9a;--hot:#ff2e6e;--yel:#f2ea3a;--paper:#f3efe6;--green:#21c55d;
  --mute:#9aa3ad;--glass:rgba(10,13,16,.58);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100%;background:#0b0f12;color:#fff;font-family:Pretendard,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
body{position:fixed;inset:0;overflow:hidden}
.app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}
.home,.ctl,.keys,.ctop,.inc,.shead,button{user-select:none;-webkit-user-select:none}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.han{font-family:'Black Han Sans',Pretendard,sans-serif;font-weight:400}

/* ---------- booth (home) ---------- */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;background:#000 url(assets/lena/poster.jpg) center top/cover;transition:filter .35s var(--ease),transform .35s var(--ease)}
.app.dim .bg{filter:blur(7px) brightness(.4) saturate(1.15);transform:scale(1.06)}
.dots{position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(0,0,0,.26) 1px,transparent 1.25px) 0 0/4px 4px;mix-blend-mode:multiply;
  -webkit-mask:url(assets/lena/dotmask.png) center top/cover no-repeat;mask:url(assets/lena/dotmask.png) center top/cover no-repeat}
.app.outside .dots{display:none}
.fx{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 15%,rgba(0,0,0,0) 56%,rgba(0,0,0,.8) 80%,#000 100%);mix-blend-mode:multiply}
.top{position:absolute;left:16px;right:16px;top:calc(var(--st) + 12px);display:flex;justify-content:space-between;align-items:flex-start;z-index:5}
.miss{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;border-radius:18px;background:var(--hot);color:#fff;font-weight:800;font-size:14px;box-shadow:3px 3px 0 #000;transform:rotate(-3deg);transition:transform .2s}
.miss:active{transform:rotate(-3deg) scale(.95)}
.miss svg{width:16px;height:16px;fill:#fff}
.miss.zero{visibility:hidden} /* 부재중이 없으면 자리만 지키고 숨김 */
.clock{text-align:right;line-height:1.05;text-shadow:2px 2px 0 #000}
.clock b{display:block;font-family:'Space Mono',monospace;font-size:30px;color:var(--mint);letter-spacing:-1px}
.clock span{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:1px;opacity:.9}

.flyers{position:absolute;inset:0;pointer-events:none;z-index:3}
.fly{position:absolute;pointer-events:auto;color:#111;padding:12px 13px 13px;background-size:100% 100%;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.55));transition:transform .25s var(--ease)}
.fly:active{transform:scale(.96) rotate(var(--r))}
.fly .tp{position:absolute;left:50%;top:-10px;width:70px;height:18px;margin-left:-35px;background-size:100% 100%;transform:rotate(-4deg)}
.fly small{display:block;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;opacity:.72;letter-spacing:.5px}
.fly b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:800;line-height:1.3;word-break:keep-all}
.fly i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fly i{display:block;font-style:normal;font-size:12.5px;font-weight:600;line-height:1.45}
.fly i.d{text-decoration:line-through;opacity:.45}
.f1{right:12px;top:calc(var(--st) + 92px);width:136px;transform:rotate(5deg);--r:5deg;background-image:url(assets/lena/paper_pink.webp);color:#fff}
.f2{left:12px;top:calc(var(--st) + 200px);width:124px;transform:rotate(-5deg);--r:-5deg;background-image:url(assets/lena/paper_yellow.webp);padding-bottom:20px}
.coinb{position:absolute;right:16px;top:calc(var(--st) + 206px);display:flex;align-items:center;gap:4px;pointer-events:auto;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;text-shadow:1px 1px 0 #000}
.coinb img{width:30px;height:30px}
/* 오늘의 운세 쪽지 */
.fslip{position:relative;margin:14px 4px 6px;padding:26px 18px 18px;color:#1a1a1a;background:#f3efe6 url(assets/lena/paper_white.webp) center/cover;border-radius:3px;box-shadow:4px 5px 0 rgba(0,0,0,.55);transform:rotate(-.6deg)}
.fslip .ftape{position:absolute;left:50%;top:-12px;width:96px;height:26px;margin-left:-48px;background:url(assets/lena/tape_pink1.webp) center/100% 100% no-repeat;transform:rotate(-3deg)}
.fslip.sealed{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background-blend-mode:multiply;background-color:#e9e2d2}
.fslip.sealed::before{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:2px dashed rgba(0,0,0,.18)}
.fslip.sealed b{font-family:'Black Han Sans';font-weight:400;font-size:22px;position:relative}
.fslip.sealed p{font-size:13.5px;opacity:.7;position:relative;word-break:keep-all}
.fseal{width:58px;height:58px;position:relative;transform:rotate(8deg)}
.fslip.open{animation:funfold .55s var(--ease) both}
@keyframes funfold{from{transform:rotate(-.6deg) scaleY(.12);opacity:0}60%{opacity:1}to{transform:rotate(-.6deg) scaleY(1)}}
@media (prefers-reduced-motion:reduce){.fslip.open{animation:none}}
.ftop{display:flex;align-items:baseline;gap:8px}
.fstar{font-size:26px;letter-spacing:2px;color:var(--pink);text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.fk{font-size:12.5px;font-weight:700;opacity:.6}
.fline{font-family:'Black Han Sans';font-weight:400;font-size:21px;line-height:1.35;margin:6px 0 14px;word-break:keep-all}
.fmeters{display:grid;gap:6px;padding:10px 0;border-top:1.5px dashed rgba(0,0,0,.25);border-bottom:1.5px dashed rgba(0,0,0,.25)}
.fm{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.fm span{width:30px}
.fm i{display:flex;gap:5px}
.fm b{width:16px;height:16px;border-radius:50%;border:2px solid #1a1a1a;background:transparent}
.fm b.on{background:var(--pink)}
.fm:nth-child(2) b.on{background:var(--teal)}.fm:nth-child(3) b.on{background:var(--yel)}
.flucky{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 0 10px;text-align:center}
.flucky>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700}
.flucky small,.fwarn small{font-size:11.5px;font-weight:600;opacity:.6}
.fnum{font-family:'Space Mono',monospace;font-size:28px;line-height:1}
.fsw{width:28px;height:28px;border-radius:50%;border:2px solid #1a1a1a}
.fit{word-break:keep-all;line-height:1.3}
.fwarn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,46,110,.12);font-size:14px;font-weight:700}
.fsay{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14.5px;line-height:1.5;font-weight:600;word-break:keep-all}
.fsay i{flex:none;width:40px;height:40px;border-radius:50%;background:url(assets/lena/face.jpg) 50% 30%/cover;border:2px solid #1a1a1a}
.fsay i.cat{background-image:url(assets/lena/cat.jpg);background-position:center}
.fslip .row{margin-top:14px}
.fpast{display:flex;flex-direction:column;gap:6px}
.fprow{display:grid;grid-template-columns:42px 70px 1fr;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left;font-size:13px}
.fprow .fpd{font-family:'Space Mono',monospace;color:var(--mute)}.fprow .fps{color:var(--pink);letter-spacing:1px}.fprow .fpl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpast .fslip{margin:4px 2px 10px;transform:none}
img{object-fit:contain} /* 그림이 찌그러지지 않게: 따로 cover를 준 곳만 꽉 채움 */
.ci{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;margin:0 2px;object-fit:contain}

.lenahit{position:absolute;left:28%;right:12%;top:36%;height:30%;z-index:2}
.knock{position:absolute;z-index:4;width:150px;left:-10px;top:38%;pointer-events:auto;opacity:0;transform:translateX(-60px) rotate(-12deg);transition:opacity .3s,transform .5s var(--ease)}
.knock.on{opacity:1;transform:translateX(0) rotate(-12deg)}
.knock.tap{animation:knock .6s 2}
.knock span{position:absolute;left:96px;top:6px;font-family:'Black Han Sans';font-size:22px;color:var(--pink);text-shadow:2px 2px 0 #000;transform:rotate(-8deg);white-space:nowrap}
@keyframes knock{0%,100%{transform:rotate(-12deg)}30%{transform:translate(8px,4px) rotate(-6deg)}60%{transform:rotate(-12deg)}75%{transform:translate(6px,3px) rotate(-8deg)}}

.sub{position:absolute;left:18px;right:18px;bottom:calc(var(--sb) + 132px);text-align:center;z-index:5}
.who{display:inline-block;font-family:'Black Han Sans';font-size:13px;letter-spacing:2px;color:#000;background:var(--teal);padding:3px 9px 2px;transform:rotate(-2deg);margin-bottom:9px}
.line{font-size:18.5px;font-weight:700;line-height:1.5;word-break:keep-all;white-space:pre-line;min-height:1.5em;
  text-shadow:0 0 1px #000,1.5px 1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px -1.5px 0 #000,0 3px 12px rgba(0,0,0,.85)}
.line em,.her em{font-style:normal;color:var(--pink)}

.ctl{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 26px);display:flex;justify-content:center;align-items:flex-start;gap:30px;z-index:5}
.ctl>div{text-align:center}
.rb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .15s}
.rb:active{transform:scale(.92)}
.rb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb{font-size:11.5px;color:#d7e3e0;opacity:.85;margin-top:6px;font-weight:600}
.call{width:78px;height:78px;background:var(--green);border:3px solid #000;box-shadow:4px 4px 0 var(--pink);margin-top:-10px}
.call svg{width:34px;height:34px;fill:#fff;stroke:none}
.call.end{background:var(--hot);box-shadow:4px 4px 0 var(--teal)}
.call.end svg{transform:rotate(135deg)}

.pop{position:absolute;z-index:6;width:64px;pointer-events:none;animation:pop 1.6s var(--ease) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-30deg)}18%{opacity:1;transform:scale(1.15) rotate(8deg)}30%{transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(.9) rotate(6deg)}}
.kiss{position:absolute;z-index:6;width:58px;margin:-18px 0 0 -29px;pointer-events:none;opacity:0;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.5));animation:kiss 1.4s var(--ease) forwards}
@keyframes kiss{0%{opacity:0;transform:translate(0,0) scale(.15) rotate(0)}15%{opacity:1;transform:translate(calc(var(--dx)*.15),calc(var(--dy)*.15)) scale(.6) rotate(calc(var(--r)*.4))}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--r))}}
.coinfly{position:absolute;z-index:60;width:44px;pointer-events:none;animation:coin 1s var(--ease) forwards}
@keyframes coin{0%{transform:translateY(0) scale(.6) rotateY(0);opacity:0}20%{opacity:1;transform:translateY(-50px) scale(1.1) rotateY(180deg)}100%{transform:translateY(-140px) scale(.7) rotateY(720deg);opacity:0}}

/* ---------- call screen ---------- */
.callv{position:absolute;inset:0;z-index:20;display:none;flex-direction:column}
.app.calling .callv{display:flex}
.app.calling .home{display:none}
.ctop{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 12px) 16px 0}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:rgba(0,0,0,.62);border:1px solid var(--line);font-family:'Space Mono',monospace;font-size:13px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.log{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px;-webkit-mask:linear-gradient(transparent,#000 22%);mask:linear-gradient(transparent,#000 22%);user-select:text;-webkit-user-select:text}
.log::before{content:"";flex:1}
.me{align-self:flex-end;max-width:80%;background:var(--paper);color:#111;font-size:15px;font-weight:600;line-height:1.45;padding:9px 13px;border-radius:3px;transform:rotate(.8deg);box-shadow:3px 3px 0 #000;word-break:keep-all;white-space:pre-wrap}
.me.img::before{content:"사진 · ";color:var(--hot);font-weight:800}
.her{font-size:17px;font-weight:700;line-height:1.55;word-break:keep-all;white-space:pre-wrap;max-width:94%;
  text-shadow:0 0 1px #000,1.5px 1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px -1.5px 0 #000,0 2px 10px rgba(0,0,0,.8)}
.her .who{margin:0 7px 0 0;font-size:11px;vertical-align:2px;text-shadow:none}
.note{align-self:center;background:var(--teal);color:#000;font-size:13px;font-weight:800;padding:7px 12px;box-shadow:3px 3px 0 #000;transform:rotate(-1.2deg);display:flex;gap:10px;align-items:center;max-width:92%}
.note button{text-decoration:underline;font-weight:800;white-space:nowrap;flex:none}
.dots{display:inline-flex;gap:5px;vertical-align:middle}.dots i{width:7px;height:7px;border-radius:50%;background:#fff;animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 82%,transparent);mask:linear-gradient(90deg,#000 82%,transparent)}
.quick::after{content:"";flex:none;width:18%} /* 마지막 칩이 흐림에 묻히지 않게 */
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;height:34px;padding:0 13px;border-radius:17px;background:rgba(0,0,0,.6);border:1px solid rgba(47,224,200,.45);color:var(--mint);font-size:13.5px;font-weight:600}
.inrow{display:flex;gap:9px;align-items:center;padding:0 14px calc(var(--sb) + 14px)}
.f{flex:1;min-width:0;height:52px;border-radius:26px;background:rgba(0,0,0,.66);border:1px solid var(--line);padding:0 18px;outline:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);user-select:text;-webkit-user-select:text}
.f::placeholder{color:#8b949c}
.f:focus{border-color:var(--teal)}
.sq{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);border:1px solid var(--line)}
.sq svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq.rec{background:var(--hot);border-color:var(--hot);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,46,110,.25)}}
.sq.go{background:var(--pink);border:2px solid #000;box-shadow:2px 2px 0 #000}
.inrow .call{width:52px;height:52px;border-width:2px;margin:0;box-shadow:3px 3px 0 var(--teal)}
.inrow .call svg{width:24px;height:24px}
.attp{display:none;align-items:center;gap:10px;margin:0 16px 8px;padding:6px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:12px;font-size:13px}
.attp.on{display:flex}.attp img{width:44px;height:44px;object-fit:cover;border-radius:8px}.attp button{margin-left:auto;width:32px;height:32px;font-size:20px}

/* ---------- incoming ---------- */
.inc{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;padding-top:calc(var(--st) + 100px);background:rgba(0,0,0,.35)}
.inc.on{display:flex}
.app.ringing .home,.app.ringing .callv{display:none!important}
.ab em[hidden],.k em[hidden]{display:none}
.app.outside .inc{background:rgba(6,9,11,.55)}
.app.dim .flyers,.app.dim .knock,.app.dim .lenahit{opacity:0;pointer-events:none;transition:opacity .25s}
.ava{width:136px;height:136px;border-radius:50%;background:url(assets/lena/cat.jpg) center/cover;border:3px solid #000;box-shadow:5px 5px 0 var(--pink);animation:ring 1.2s infinite}
@keyframes ring{0%,100%{box-shadow:5px 5px 0 var(--pink),0 0 0 0 rgba(47,224,200,.45)}70%{box-shadow:5px 5px 0 var(--pink),0 0 0 22px rgba(47,224,200,0)}}
.inc h1{font-family:'Black Han Sans';font-weight:400;font-size:46px;margin-top:24px;letter-spacing:1px;text-shadow:3px 3px 0 var(--pink)}
.inc p{font-family:'Space Mono',monospace;color:var(--mint);font-size:13px;letter-spacing:2px;margin-top:6px;text-transform:uppercase}
.inc .q{margin-top:30px;font-size:17px;font-weight:700;text-align:center;line-height:1.55;padding:0 30px;word-break:keep-all;text-shadow:1px 1px 0 #000}
.ans{position:absolute;bottom:calc(var(--sb) + 64px);left:0;right:0;display:flex;justify-content:space-around;padding:0 44px}
.ans>div{text-align:center}.ans .lb{font-size:13px;margin-top:10px;color:#fff}
.ans .call{margin-top:0}

/* ---------- sheets ---------- */
.sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.sheet.open{opacity:1;pointer-events:auto}
.panel{position:relative;max-height:calc(100% - var(--st) - 40px);display:flex;flex-direction:column;background:var(--panel);border-top:3px solid #000;border-radius:22px 22px 0 0;box-shadow:0 -6px 0 var(--pink);transform:translateY(40px);transition:transform .32s var(--ease);padding-bottom:var(--sb)}
.sheet.open .panel{transform:none}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px) 0 0/4px 4px}
.shead{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.shead .num{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:linear-gradient(#eef0ea,#c9cdc4);color:#111;border:2px solid #000;box-shadow:0 2px 0 #000;font-family:'Space Mono',monospace;font-weight:700;font-size:16px}
.shead h2{font-family:'Black Han Sans';font-weight:400;font-size:24px;letter-spacing:.5px;text-shadow:2px 2px 0 var(--pink);line-height:1}
.shead .s{font-size:12.5px;color:var(--mute);margin-top:4px}
.sx{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.sx svg{width:20px;height:20px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
.sbody{overflow-y:auto;padding:4px 16px 22px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.lbl{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--teal);text-transform:uppercase;margin:18px 2px 8px}
.lbl:first-child{margin-top:6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.in{flex:1;min-width:0;height:46px;border-radius:12px;background:#0b0d10;border:1px solid var(--line);padding:0 13px;outline:none;color:#fff}
.in:focus{border-color:var(--teal)}
.in[type=time],.in[type=datetime-local],.in[type=date]{color-scheme:dark;flex:0 0 auto}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa3ad 50%),linear-gradient(135deg,#9aa3ad 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.btn{height:46px;padding:0 16px;border-radius:12px;background:var(--pink);color:#fff;font-weight:800;border:2px solid #000;box-shadow:2px 2px 0 #000;flex:none;white-space:nowrap}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:#e6eef0;font-weight:700}
.btn.teal{background:var(--teal);color:#000}
.btn.wide{flex:1}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pills button{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:#0b0d10;font-size:13.5px;font-weight:600;color:#dfe7ea}
.pills button.on{background:var(--teal);color:#000;border-color:var(--teal);font-weight:800}
.hint{font-size:12.5px;color:var(--mute);line-height:1.5;margin-top:8px;word-break:keep-all}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6;word-break:keep-all}
.empty img{width:64px;display:block;margin:0 auto 10px;opacity:.9}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:#0b0d10;border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:#cdd6da}
.tabs button.on{background:var(--pink);color:#fff;box-shadow:2px 2px 0 #000}

/* board papers */
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:10px 2px 4px}
.pp{position:relative;min-height:112px;padding:16px 12px 14px;color:#111;background-size:100% 100%;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.6));transition:transform .2s;display:flex;flex-direction:column}
.pp:nth-child(4n+1){transform:rotate(-2deg)}.pp:nth-child(4n+2){transform:rotate(1.6deg)}.pp:nth-child(4n+3){transform:rotate(1deg)}.pp:nth-child(4n){transform:rotate(-1.2deg)}
.pp .tp{position:absolute;left:50%;top:-9px;width:62px;height:16px;margin-left:-31px;background-size:100% 100%}
.pp small{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;opacity:.7}
.pp b{font-size:15px;font-weight:800;line-height:1.35;word-break:keep-all;margin-top:3px;flex:1}
.pp.pink{background-image:url(assets/lena/paper_pink.webp);color:#fff}.pp.pink small{opacity:.85}
.pp.yel{background-image:url(assets/lena/paper_yellow.webp)}
.pp.teal{background-image:url(assets/lena/paper_teal.webp);padding-bottom:30px}
.pp.white{background-image:url(assets/lena/paper_white.webp)}
.pp.late b::after{content:" · 지남";color:var(--hot);font-size:12px}
.pp.pink.late b::after{color:#fff;text-decoration:underline}
.pp .acts{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ck{width:34px;height:34px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;opacity:.85}
.ck svg{width:18px;height:18px;stroke:currentColor;stroke-width:3;fill:none;opacity:0}
.pp.done .ck svg{opacity:1}.pp.done{opacity:.55}.pp.done b{text-decoration:line-through}
.del{width:30px;height:30px;font-size:20px;opacity:.6;line-height:1}
.pp.tear{animation:tear .7s var(--ease) forwards}
@keyframes tear{30%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(24deg) translate(30px,260px);opacity:0}}
.wk{display:flex;flex-direction:column;gap:10px}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day.today{border-color:var(--pink);box-shadow:3px 3px 0 var(--pink)}
.day h4{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.day h4 span{font-family:'Space Mono',monospace;font-size:11px;color:var(--teal);font-weight:700}
.ev{display:flex;gap:10px;font-size:14px;margin-top:6px;line-height:1.4}
.ev span{font-family:'Space Mono',monospace;color:var(--mint);font-size:12.5px;flex:none;padding-top:1px}
.ev.d{opacity:.45;text-decoration:line-through}
.ev.none{color:var(--mute);font-size:13px}

.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.it:last-child{border-bottom:0}
.it .t{flex:1;min-width:0;font-size:15px;line-height:1.45;word-break:keep-all}
.it .t small{display:block;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--mute);margin-top:2px}
.it .ic{width:38px;height:38px;flex:none}
.it .x{width:34px;height:34px;flex:none;font-size:20px;color:var(--mute)}
.it.missed .t small{color:var(--hot)}
.diary{background:var(--paper);color:#151515;border-radius:3px;padding:14px 14px 16px;box-shadow:3px 3px 0 #000;position:relative;font-size:15px;line-height:1.65;word-break:keep-all}
.diary+.diary{margin-top:18px}
.diary h5{font-family:'Space Mono',monospace;font-size:11.5px;color:#c2185b;margin-bottom:6px}
.diary .tp{position:absolute;right:16px;top:-9px;width:60px;height:16px;background-size:100% 100%;transform:rotate(6deg)}

.coins{display:flex;align-items:center;gap:14px}
.coins img{width:78px;filter:drop-shadow(3px 3px 0 #000)}
.coins b{font-family:'Space Mono',monospace;font-size:40px;color:var(--yel);text-shadow:3px 3px 0 #000;line-height:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.bars i{display:block;width:100%;max-width:30px;background:var(--teal);border:2px solid #000;border-radius:4px 4px 0 0;min-height:4px}
.bars div.t i{background:var(--pink)}
.bars span{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--mute)}

/* dial pad */
.pad{margin:0 14px 14px;border-radius:22px;padding:16px 16px 14px;background:linear-gradient(160deg,#1fa65a,#11753d);border:3px solid #000;box-shadow:6px 6px 0 var(--pink),inset 0 1px 0 rgba(255,255,255,.35)}
.lcd{background:#0d1f17;border:2px solid #000;border-radius:8px;padding:9px 12px;font-family:'Space Mono',monospace;color:#7dffb5;font-size:13px;display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;text-shadow:0 0 6px rgba(125,255,181,.6);white-space:nowrap;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:60px;border-radius:12px;background:linear-gradient(#f2f4ee,#c9cdc4);border:2px solid #000;box-shadow:0 3px 0 #000;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.k b{font-family:'Space Mono',monospace;font-size:21px;line-height:1}
.k span{font-size:11.5px;font-weight:700;margin-top:3px;opacity:.8}
.k.hot{background:linear-gradient(#ff7ab6,#ff3d9a);color:#fff}
.k em{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--hot);color:#fff;border:2px solid #000;font-style:normal;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.sheet.padsheet .panel{background:transparent;border:0;box-shadow:none}
.sheet.padsheet .panel::before{display:none}

/* toast */
.toast{position:absolute;left:16px;right:16px;top:calc(var(--st) + 60px);z-index:70;display:flex;align-items:center;gap:10px;background:var(--teal);color:#000;font-weight:800;font-size:14px;padding:11px 14px;box-shadow:4px 4px 0 #000;transform:translateY(-220px) rotate(-1deg);opacity:0;transition:transform .35s var(--ease),opacity .2s}
.toast.on{transform:translateY(0) rotate(-1deg);opacity:1}
.toast span{flex:1;line-height:1.4;word-break:keep-all}
.toast button{text-decoration:underline;font-weight:800;flex:none}
.hidden{display:none!important}

/* ---------- 밖 모드 (음성통화) ---------- */
.ahead,.agrid{display:none}
.app.outside{background:#0b0f12}
.app.outside .bg,.app.outside .fx,.app.outside .home{display:none}
.app.outside::before{content:"";position:absolute;inset:-60px;background:url(assets/lena/cat.jpg) center 35%/cover;filter:blur(42px) brightness(.36) saturate(1.35)}
.app.outside::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(0,0,0,.22) 1px,transparent 1.2px) 0 0/4px 4px}
.app.outside .callv{display:flex}
.app.outside .ctop{display:none}
.app.outside #hangBtn{display:none}
.app.outside .ahead{display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 30px) 16px 4px;flex:none}
.aava{width:104px;height:104px;border-radius:50%;background:url(assets/lena/cat.jpg) center/cover;border:3px solid #000;box-shadow:4px 4px 0 var(--pink)}
.ahead h1{font-family:'Black Han Sans';font-weight:400;font-size:34px;margin-top:12px;letter-spacing:1px;text-shadow:2px 2px 0 var(--pink);line-height:1}
.ahead p{font-family:'Space Mono',monospace;font-size:13px;color:var(--mint);margin-top:6px;letter-spacing:1px}
.app.outside .agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 0;padding:6px 24px 12px;flex:none}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#e3ecee;position:relative}
.ab i{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;transition:transform .15s}
.ab:active i{transform:scale(.92)}
.ab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ab.on i{background:#fff}.ab.on svg{stroke:#111}
.ab.vid i{background:var(--pink);border:2px solid #000;box-shadow:3px 3px 0 #000}
.ab em{position:absolute;top:-4px;left:calc(50% + 16px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--hot);color:#fff;border:2px solid #000;font-style:normal;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.app.outside .log{-webkit-mask:linear-gradient(transparent,#000 18%);mask:linear-gradient(transparent,#000 18%)}
.app.outside .pop{width:52px}
.vtog{height:36px;padding:0 13px;border-radius:18px;background:rgba(0,0,0,.6);border:1.5px solid var(--green);box-shadow:2px 2px 0 #000;font-size:13px;font-weight:700;color:#e6eef0;display:flex;align-items:center;gap:6px}
.vtog svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-height:640px){.app.outside .agrid{display:none}.aava{width:72px;height:72px}.ahead h1{font-size:26px}}


/* 영상통화 중: 레나가 보이게 대화는 아래쪽 반투명 판에 */
.app.calling:not(.outside) .log{flex:none;height:min(28vh,236px);transition:height .25s;margin-top:auto;margin:auto 10px 6px;padding:12px 12px 8px;border-radius:18px;background:rgba(8,10,13,.62);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.1);-webkit-mask:linear-gradient(transparent,#000 14%);mask:linear-gradient(transparent,#000 14%);gap:9px}
.app.calling:not(.outside) .log::before{display:none}
.app.calling.lmin:not(.outside) .log{height:86px}
.app.calling:not(.outside) .log>:first-child{margin-top:auto} /* 메시지가 적으면 아래부터 쌓임 */
.ltog{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.5);color:#fff;font-size:13px;font-weight:700;margin-left:auto;margin-right:6px}
.app.outside .ltog{display:none}
.app.calling:not(.outside) .her{font-size:15px;line-height:1.5;text-shadow:none}
.app.calling:not(.outside) .me{font-size:14px;padding:7px 11px}
.app.calling:not(.outside) .ask{font-size:13.5px}
.app.calling:not(.outside) .callv{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 14%)}
@media (max-height:740px){
 .app.outside .ahead{padding-top:calc(var(--st) + 14px);flex-direction:row;justify-content:center;gap:12px}
 .aava{width:58px;height:58px;border-width:2px;box-shadow:3px 3px 0 var(--pink)}
 .ahead h1{font-size:26px;margin-top:0}
 .ahead p{margin-top:0}
 .app.outside .agrid{gap:6px 0;padding:4px 18px 8px}
 .ab i{width:50px;height:50px}.ab svg{width:22px;height:22px}.ab{font-size:11px;gap:4px}
 .quick{padding-bottom:6px}
 .f1{width:118px;padding:10px 11px 11px}.f1 b{font-size:13.5px}
 .f2{width:112px}.knock{width:118px;top:44%}
}
.ahead .hd{display:flex;flex-direction:column;align-items:center}
@media (max-height:700px){.f1{top:calc(var(--st) + 78px)}.f2{top:calc(var(--st) + 170px)}.coinb{top:calc(var(--st) + 182px)}.sub{bottom:calc(var(--sb) + 118px)}.line{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <video class="bg" id="bg" src="assets/lena/bg.mp4" poster="assets/lena/poster.jpg" muted loop playsinline preload="auto" aria-hidden="true"></video>
  <div class="dots"></div><div class="fx"></div>

  <!-- HOME -->
  <section class="home" id="home">
    <div class="top">
      <button class="miss zero" id="missBtn"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg><span id="missTx">부재중 없음</span></button>
      <button class="vtog" id="toAudio"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z" fill="#21c55d" stroke="none"/></svg>음성통화로</button>
      <div class="clock"><b id="clk">--:--</b><span id="dte"></span></div>
    </div>
    <div class="flyers" id="flyers"></div>
    <div class="lenahit" id="lenaHit" aria-label="레나"></div>
    <div class="knock" id="knock"><img src="assets/lena/knock.webp" alt="" style="width:100%"><span>똑똑</span></div>
    <div class="sub"><div class="who">레나</div><div class="line" id="line"></div></div>
    <div class="ctl">
      <div><button class="rb" id="dialBtn" aria-label="다이얼"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/><circle cx="6" cy="18" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="18" cy="18" r="1.3"/></svg></button><div class="lb">다이얼</div></div>
      <div><button class="rb call" id="pickBtn" aria-label="수화기 들기"><svg viewBox="0 0 24 24"><use href="#ph"/></svg></button><div class="lb">수화기 들기</div></div>
      <div><button class="rb" id="boardBtn" aria-label="전단지"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 15h8M8 19h5"/></svg></button><div class="lb">전단지</div></div>
    </div>
  </section>

  <!-- CALL -->
  <section class="callv" id="callv">
    <div class="ahead"><div class="aava"></div><div class="hd"><h1>레나</h1><p id="aT">통화 중 00:00</p></div></div>
    <div class="ctop"><div class="chip"><i></i><span id="callT">통화 중 00:00</span></div><button class="ltog" id="logTog">대화 접기</button><button class="vtog" id="toAudio2"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z" fill="#21c55d" stroke="none"/></svg>음성통화로</button></div>
    <div class="log" id="log"></div>
    <div class="attp" id="attp"><img id="attImg" alt=""><span>사진을 같이 보낼게요</span><button id="attX" aria-label="사진 빼기">×</button></div>
    <div class="agrid" id="agrid">
      <button class="ab" id="aPad"><i><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/><circle cx="6" cy="18" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="18" cy="18" r="1.3"/></svg></i>키패드</button>
      <button class="ab" id="aBoard"><i><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 15h8M8 19h5"/></svg></i>전단지</button>
      <button class="ab vid" id="aVid"><i><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></i>영상통화</button>
      <button class="ab" id="aCall"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg></i>예약 전화</button>
      <button class="ab" id="aMiss"><i><svg viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg></i>부재중<em id="aMissN" hidden></em></button>
      <button class="ab" id="aSet"><i><svg viewBox="0 0 24 24"><path d="M4.5 7.5h9M17.5 7.5h2M4.5 16.5h3M11.5 16.5h8"/><circle cx="15.5" cy="7.5" r="2"/><circle cx="9.5" cy="16.5" r="2"/></svg></i>설정</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="inrow">
      <button class="sq" id="attBtn" aria-label="사진"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><circle cx="9" cy="10.5" r="1.8"/><path d="M5 17l4.5-4.2 3.2 3 2.6-2.3L19.5 17"/></svg></button>
      <input type="file" id="attF" accept="image/*" hidden>
      <input class="f" id="msg" placeholder="레나에게 말하기…" autocomplete="off" enterkeyhint="send">
      <button class="sq" id="micBtn" aria-label="말로 하기"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg></button>
      <button class="sq go hidden" id="sendBtn" aria-label="보내기"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button class="rb call end" id="hangBtn" aria-label="끊기"><svg viewBox="0 0 24 24"><use href="#ph"/></svg></button>
    </div>
  </section>

  <!-- INCOMING -->
  <section class="inc" id="inc">
    <div class="ava"></div>
    <h1>레나</h1>
    <p id="incSub">MORNING CALL</p>
    <div class="q" id="incQ"></div>
    <div class="ans">
      <div><button class="rb call end" id="incNo"><svg viewBox="0 0 24 24"><use href="#ph"/></svg></button><div class="lb" id="incNoL">5분만…</div></div>
      <div><button class="rb call" id="incYes"><svg viewBox="0 0 24 24"><use href="#ph"/></svg></button><div class="lb">받기</div></div>
    </div>
  </section>

  <!-- DIAL PAD -->
  <div class="sheet padsheet" id="sPad"><div class="panel">
    <div class="pad">
      <div class="lcd"><span>LENA-LINE</span><span id="lcd">번호를 누르세요_</span></div>
      <div class="keys" id="keys"></div>
    </div>
  </div></div>

  <!-- generic sheet (content rendered by JS) -->
